name: Probe — Catalyst launch

# A throwaway rig for one question: **why does a Mac Catalyst app stop
# launching?** It aborts inside the mono runtime (`load_aot_module`) before any
# managed code runs, so nothing in the app can report on itself, and mono's
# explanation goes to os_log rather than stderr.
#
# The full CI job answers this too, but it takes ~25 minutes to reach the
# question and its logs are only readable once the whole job ends. This does the
# minimum: scaffold, build, launch, three times — adding one thing per round.
#
#   1. the plain template                          — the control
#   2. + a Velopack package reference              — does the reference alone do it?
#   3. + the entry point and the builder call      — the full opt-in
#
# Delete this workflow once the answer is written down.

on:
  push:
    branches:
      - "probe/**"
  workflow_dispatch:

jobs:
  catalyst-launch:
    name: Does a Catalyst app still launch (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PROJECT: VidraSmoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            src/cli/create-vidra-app/package-lock.json
            src/sdk/vidra-js/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'pack-local.sh') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build SDK and CLI
        shell: bash
        run: |
          (cd src/sdk/vidra-js && (npm ci || npm install) && npm run build)
          (cd src/cli/create-vidra-app && (npm ci || npm install) && npm run build)

      - name: Pack local NuGet feed
        shell: bash
        run: ./pack-local.sh

      - name: Scaffold and build the UI
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          node "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/index.js" \
            vidra-smoke --app-id=com.vidra.smoke
          (cd vidra-smoke/ui && (npm ci || npm install) && npm run build)

      - name: Create a self-signed signing identity
        timeout-minutes: 5
        shell: bash
        run: bash tests/ci/macos-selfsigned-identity.sh

      # ---- round 1: the plain template ----
      - name: 1 — the plain template
        timeout-minutes: 20
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          node "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/cli.js" build --target macos
          bash "$GITHUB_WORKSPACE/tests/ci/catalyst-launch-probe.sh" \
            "$(find src/VidraSmoke.Host/bin/Release/net10.0-maccatalyst -maxdepth 1 -name '*.app' -type d -print -quit)" \
            "${{ runner.temp }}/probe/1-plain"

      # ---- round 2: a Velopack package reference and nothing else ----
      #
      # No entry-point change, no builder call, no MainPage change. If this
      # round is where it stops launching, the reference alone is the cause and
      # the fix is in the build, not in any code Vidra wrote.
      - name: 2 — plus a Velopack package reference
        timeout-minutes: 20
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          node -e "
            const fs = require('fs');
            const file = 'src/${{ env.PROJECT }}.Host/${{ env.PROJECT }}.Host.csproj';
            const xml = fs.readFileSync(file, 'utf8');
            const version = /Vidra\.Hosting\.Maui\" Version=\"([^\"]+)\"/.exec(xml)[1];
            fs.writeFileSync(file, xml.replace(
              /(<PackageReference Include=\"Vidra\.Hosting\.Maui\"[^>]*\/>)/,
              '\$1\n    <PackageReference Include=\"Vidra.Updates.Native\" Version=\"' + version + '\" />'));
          "
          grep -n "Vidra.Updates.Native" "src/${{ env.PROJECT }}.Host/${{ env.PROJECT }}.Host.csproj"
          node "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/cli.js" build --target macos
          bash "$GITHUB_WORKSPACE/tests/ci/catalyst-launch-probe.sh" \
            "$(find src/VidraSmoke.Host/bin/Release/net10.0-maccatalyst -maxdepth 1 -name '*.app' -type d -print -quit)" \
            "${{ runner.temp }}/probe/2-reference"

      # ---- round 3: the whole opt-in ----
      - name: 3 — plus the entry point and the builder call
        timeout-minutes: 20
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          node "$GITHUB_WORKSPACE/tests/ci/native-update-setup.mjs" \
            --project "$PWD" --name ${{ env.PROJECT }} --version 1.0.0
          node "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/cli.js" build --target macos
          bash "$GITHUB_WORKSPACE/tests/ci/catalyst-launch-probe.sh" \
            "$(find src/VidraSmoke.Host/bin/Release/net10.0-maccatalyst -maxdepth 1 -name '*.app' -type d -print -quit)" \
            "${{ runner.temp }}/probe/3-full"

      # A workaround if it works, and evidence about the mechanism either way:
      # the Catalyst managed linker is what decides which assemblies reach
      # MonoBundle, and Release is the only configuration that runs it.
      - name: 4 — the same build with the managed linker off
        timeout-minutes: 20
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          node -e "
            const fs = require('fs');
            const file = 'src/${{ env.PROJECT }}.Host/${{ env.PROJECT }}.Host.csproj';
            const xml = fs.readFileSync(file, 'utf8');
            fs.writeFileSync(file, xml.replace(
              '</PropertyGroup>',
              '  <MtouchLink Condition=\"\$([MSBuild]::GetTargetPlatformIdentifier(\$(TargetFramework))) == \\'maccatalyst\\'\">None</MtouchLink>\n  </PropertyGroup>'));
          "
          grep -n "MtouchLink" "src/${{ env.PROJECT }}.Host/${{ env.PROJECT }}.Host.csproj"
          node "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/cli.js" build --target macos
          bash "$GITHUB_WORKSPACE/tests/ci/catalyst-launch-probe.sh" \
            "$(find src/VidraSmoke.Host/bin/Release/net10.0-maccatalyst -maxdepth 1 -name '*.app' -type d -print -quit)" \
            "${{ runner.temp }}/probe/4-no-linker"

      - name: Upload probe records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-launch-probe
          path: ${{ runner.temp }}/probe/**
          if-no-files-found: ignore
