name: Release NuGet

# Cross-platform NuGet release. Most Vidra packages target a platform-specific
# TFM (net10.0-maccatalyst / net10.0-windows...) that can only be built on its
# native OS, so we pack on each OS and then merge each package's per-OS builds
# into a single multi-TFM package before pushing.
#
# Run from the Actions tab. Leave `push` unchecked for a dry run that packs,
# merges, and uploads the merged packages as an artifact for inspection without
# publishing. Re-run with `push` checked to publish to nuget.org.
#
# Requires repository secret: NUGET_API_KEY (nuget.org push key, owner = vidra,
# glob pattern Vidra.*).

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Publish merged packages to nuget.org (otherwise dry-run only)"
        type: boolean
        default: false

jobs:
  # Publishing is irreversible — nuget.org does not allow re-uploading a version
  # — so the full CI suite runs first and packing only starts if it is green.
  # Without this gate a red commit could be published straight to nuget.org.
  verify:
    name: Verify before release
    uses: ./.github/workflows/ci.yml

  pack:
    name: Pack (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            maui-workload: maui
            artifact: nupkgs-macos
          - os: windows-latest
            maui-workload: maui-windows
            artifact: nupkgs-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      # See ci.yml: the macos runner image tops out below the Xcode the newest
      # maccatalyst manifest wants, so pin the newest available and skip the
      # manifest update during workload install.
      #
      # NOTE: this pin and the one below no longer match ci.yml, which dropped
      # both when the image moved to Xcode 26.6 and the Catalyst pack started
      # requiring the 26.5 SDK. So this job packs on a toolchain the suite that
      # gates it does not use. Deliberately left alone here: it only takes effect
      # on a real pack run, which no PR exercises, so it belongs with the release
      # that can prove it rather than with a batch of guards that CI can.
      - name: Select newest available Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Install MAUI workload (${{ matrix.maui-workload }})
        shell: bash
        run: dotnet workload install ${{ matrix.maui-workload }} --skip-manifest-update

      - name: Pack all Vidra packages (Release)
        shell: bash
        run: ./pack-local.sh

      - name: Upload per-OS packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/packages/*.nupkg
          if-no-files-found: error

  merge-and-push:
    name: Merge${{ inputs.push && ' + push' || ' (dry run)' }}
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      # Write, only so a successful publish can leave a tag behind.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # Both halves of the handoff are by name, which is the case the artifact
      # actions have kept stable across majors: the v5 path change applied to
      # downloads by artifact-ids, and the digest check v8 promotes from warning
      # to error is a check on our own upload from the pack job.
      - name: Download macOS packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs-macos
          path: pkg-macos

      - name: Download Windows packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs-windows
          path: pkg-windows

      - name: Merge per-OS packages into multi-TFM packages
        run: python3 scripts/merge-nupkgs.py --inputs pkg-macos pkg-windows --output merged

      - name: Upload merged packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs-merged
          path: merged/*.nupkg
          if-no-files-found: error

      # `--skip-duplicate` below is what makes a retry work after a push fails
      # part-way through nine packages, and it should stay. What it cannot tell
      # apart is the run where *every* package is already published: that one
      # skips all nine, pushes nothing, and reports success — which reads as a
      # release. nuget.org is the ground truth for what is already out, so ask
      # it before pushing, while "nothing to do" can still be told apart from
      # "done".
      - name: Refuse a push with nothing to publish
        if: ${{ inputs.push }}
        run: |
          pending=0
          for pkg in merged/*.nupkg; do
            base="$(basename "$pkg" .nupkg)"
            if [[ ! "$base" =~ ^(.+)\.([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              echo "::error::cannot read an id and version out of $base"; exit 1
            fi
            id="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
            lower="$(echo "$id" | tr '[:upper:]' '[:lower:]')"
            if curl -sf "https://api.nuget.org/v3-flatcontainer/$lower/index.json" \
                 | jq -e --arg v "$version" '.versions | index($v)' >/dev/null 2>&1; then
              echo "  $id $version — already on nuget.org, will be skipped"
            else
              echo "  $id $version — to publish"
              pending=$((pending + 1))
            fi
          done
          if [ "$pending" -eq 0 ]; then
            echo "::error::every packed version is already on nuget.org — run the Bump version workflow before releasing again"
            exit 1
          fi
          echo "$pending package(s) to publish"

      - name: Push to nuget.org
        if: ${{ inputs.push }}
        run: |
          dotnet nuget push "merged/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # Nothing has ever tagged a release, so the only record of which commit a
      # published version was built from is a workflow run's timestamp. Both
      # release workflows create the tag and neither minds finding it already
      # there — the second one to publish a given version is not a failure.
      - name: Tag the published version
        if: ${{ inputs.push }}
        run: bash tests/ci/tag-release.sh
