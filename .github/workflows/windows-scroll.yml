name: Windows scroll check (issue 14)

on:
  push:
    branches: [check/windows-scroll]
  workflow_dispatch:

env:
  NUGET_XMLDOC_MODE: skip
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  VIDRA_VERSION: "0.5.0"

jobs:
  scroll:
    name: Packaged app scrolls (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      APP_DIR: C:\vc\scroll\hello-vidra
      OUT_DIR: C:\vc\out
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install MAUI workload (maui-windows)
        run: dotnet workload install maui-windows

      - name: npx create-vidra-app, npm run build
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path C:\vc\scroll, $env:OUT_DIR | Out-Null
          Set-Location C:\vc\scroll
          npx --yes "create-vidra-app@$env:VIDRA_VERSION" hello-vidra --app-id=com.vidra.hellowin
          Set-Location hello-vidra
          npm run build

      - name: Scroll the packaged app
        timeout-minutes: 10
        run: |
          $zip = Get-ChildItem "$env:APP_DIR\dist" -Filter *.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath C:\vc\scroll\app -Force
          $exe = Get-ChildItem -Path C:\vc\scroll\app -Recurse -Filter "*.Host.exe" | Select-Object -First 1
          ./tests/ci/windows-scroll-check.ps1 -Exe $exe.FullName -OutDir $env:OUT_DIR

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scroll
          path: C:\vc\out
          if-no-files-found: ignore
