name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a branch be exercised without opening a PR — useful when the change
  # being tested *is* the workflow.
  workflow_dispatch:
  # Callable as a gate by other workflows (see release-nuget.yml), so a release
  # cannot publish from a commit that hasn't passed this suite.
  workflow_call:

# A push supersedes the run before it — no reason to keep paying for a commit
# nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Restore spends real time unpacking XML documentation nobody reads in CI,
  # and the first-run/telemetry pings add latency to every dotnet invocation.
  NUGET_XMLDOC_MODE: skip
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Fast, deterministic tier: runs every unit, contract, and scaffold
  # integration test on a single Linux runner. All C# projects under
  # tests/dotnet/** target net10.0 (non-MAUI) so MAUI workloads are not
  # required here.
  #
  # Linux is a *build host*, not a Vidra target — there is no Linux app to
  # package — so this tier covers framework correctness and the CLI's
  # platform guard rails, and leaves artifacts to the per-OS smoke tier.
  unit-and-contract:
    name: Unit + contract (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            src/cli/create-vidra-app/package-lock.json
            src/sdk/vidra-js/package-lock.json

      # NuGet restore dominates the per-OS jobs — on Windows the dogfood host
      # spent ~115s restoring and only ~20s compiling. The packages are keyed by
      # the project files, so a hit makes every later restore in the job (the
      # dogfood host, pack-local.sh, the scaffolded app) essentially free.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'pack-local.sh') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # One version for everything Vidra publishes. Cheap, and it fails the
      # commit rather than the release: npm and nuget.org both refuse to
      # re-publish a version, so drift discovered at publish time is permanent.
      - name: Versions are consistent
        run: node scripts/version.mjs check

      # ---- C# unit + contract + codegen snapshots ----
      - name: Restore C# test projects
        run: |
          dotnet restore tests/dotnet/Vidra.Bridge.Tests/Vidra.Bridge.Tests.csproj
          dotnet restore tests/dotnet/Vidra.CodeGen.Tests/Vidra.CodeGen.Tests.csproj
          dotnet restore tests/dotnet/Vidra.CodeGen.AppFixture/Vidra.CodeGen.AppFixture.csproj
          dotnet restore tests/dotnet/Vidra.Modules.FileSystem.Tests/Vidra.Modules.FileSystem.Tests.csproj
          dotnet restore tests/dotnet/Vidra.Modules.Windowing.Tests/Vidra.Modules.Windowing.Tests.csproj
          dotnet restore tests/dotnet/Vidra.Modules.Essentials.Tests/Vidra.Modules.Essentials.Tests.csproj
          dotnet restore tests/dotnet/Vidra.Updates.Tests/Vidra.Updates.Tests.csproj
          dotnet restore tests/dotnet/Vidra.Updates.Native.Tests/Vidra.Updates.Native.Tests.csproj

      - name: Build C# test projects
        run: |
          dotnet build tests/dotnet/Vidra.Bridge.Tests/Vidra.Bridge.Tests.csproj -c Release --no-restore
          dotnet build tests/dotnet/Vidra.CodeGen.Tests/Vidra.CodeGen.Tests.csproj -c Release --no-restore
          dotnet build tests/dotnet/Vidra.CodeGen.AppFixture/Vidra.CodeGen.AppFixture.csproj -c Release --no-restore
          dotnet build tests/dotnet/Vidra.Modules.FileSystem.Tests/Vidra.Modules.FileSystem.Tests.csproj -c Release --no-restore
          dotnet build tests/dotnet/Vidra.Modules.Windowing.Tests/Vidra.Modules.Windowing.Tests.csproj -c Release --no-restore
          dotnet build tests/dotnet/Vidra.Modules.Essentials.Tests/Vidra.Modules.Essentials.Tests.csproj -c Release --no-restore
          dotnet build tests/dotnet/Vidra.Updates.Tests/Vidra.Updates.Tests.csproj -c Release --no-restore
          dotnet build tests/dotnet/Vidra.Updates.Native.Tests/Vidra.Updates.Native.Tests.csproj -c Release --no-restore

      - name: Run Vidra.Bridge.Tests
        run: dotnet test tests/dotnet/Vidra.Bridge.Tests/Vidra.Bridge.Tests.csproj -c Release --no-build --logger "trx;LogFileName=bridge.trx"

      - name: Run Vidra.CodeGen.Tests
        run: dotnet test tests/dotnet/Vidra.CodeGen.Tests/Vidra.CodeGen.Tests.csproj -c Release --no-build --logger "trx;LogFileName=codegen.trx"

      - name: Check generated app contracts are fresh
        run: |
          dotnet msbuild tests/dotnet/Vidra.CodeGen.AppFixture/Vidra.CodeGen.AppFixture.csproj -p:Configuration=Release -t:VidraCodeGenCheck
          dotnet msbuild tests/dotnet/Vidra.CodeGen.AppFixture/MissingAggregateTarget.proj -t:VidraCodeGen
          # Multi-assembly, core-scope codegen — the shape the dogfood host uses,
          # exercised here so it isn't only covered by the two platform jobs.
          dotnet msbuild tests/dotnet/Vidra.CodeGen.AppFixture/AggregateScope.proj -t:VerifyAggregateCodeGen

      - name: Run Vidra.Modules.FileSystem.Tests
        run: dotnet test tests/dotnet/Vidra.Modules.FileSystem.Tests/Vidra.Modules.FileSystem.Tests.csproj -c Release --no-build --logger "trx;LogFileName=modules-filesystem.trx"

      - name: Run Vidra.Modules.Windowing.Tests
        run: dotnet test tests/dotnet/Vidra.Modules.Windowing.Tests/Vidra.Modules.Windowing.Tests.csproj -c Release --no-build --logger "trx;LogFileName=modules-windowing.trx"

      - name: Run Vidra.Modules.Essentials.Tests
        run: dotnet test tests/dotnet/Vidra.Modules.Essentials.Tests/Vidra.Modules.Essentials.Tests.csproj -c Release --no-build --logger "trx;LogFileName=modules-essentials.trx"

      # The update client is deliberately MAUI-free so its decisions — which
      # bundle is installable, what a failed boot does, whether an archive is
      # safe to extract — are testable here rather than only through a packaged
      # app on the per-OS legs.
      - name: Run Vidra.Updates.Tests
        run: dotnet test tests/dotnet/Vidra.Updates.Tests/Vidra.Updates.Tests.csproj -c Release --no-build --logger "trx;LogFileName=updates.trx"

      # The Mac Catalyst locator and the native config resolution are plain
      # .NET — a locator is a function of a process path and the files under it
      # — so both are decided here in milliseconds. The conformance test in the
      # same project needs a real Mac and skips itself; it runs on the macOS
      # leg, where Velopack's own locator can be constructed to compare against.
      - name: Run Vidra.Updates.Native.Tests
        run: dotnet test tests/dotnet/Vidra.Updates.Native.Tests/Vidra.Updates.Native.Tests.csproj -c Release --no-build --logger "trx;LogFileName=updates-native.trx"

      # ---- TypeScript SDK ----
      - name: Install SDK dependencies
        working-directory: src/sdk/vidra-js
        run: npm ci || npm install

      - name: Type-check SDK
        working-directory: src/sdk/vidra-js
        run: npx tsc --noEmit

      - name: Run SDK tests
        working-directory: src/sdk/vidra-js
        run: npm test

      # ---- TypeScript CLI ----
      - name: Install CLI dependencies
        working-directory: src/cli/create-vidra-app
        run: npm ci || npm install

      - name: Run CLI tests (unit + scaffold integration)
        working-directory: src/cli/create-vidra-app
        run: npm test

      - name: Build CLI
        working-directory: src/cli/create-vidra-app
        run: npm run build

      # ---- CLI behaviour on an unsupported platform ----
      #
      # Linux is detected by the CLI but has no build target. These assertions
      # pin the guard rails so the failure stays a clear message instead of
      # becoming a stack trace or, worse, a partial build.
      - name: Assert the CLI rejects Linux as a build target
        run: |
          set +e
          output=$(node src/cli/create-vidra-app/dist/cli.js build --target linux 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ $code -eq 0 ]; then
            echo "::error::vidra build --target linux should exit non-zero"
            exit 1
          fi
          echo "$output" | grep -qi "unsupported target" || {
            echo "::error::expected an 'unsupported target' message"; exit 1; }

      - name: Run vidra doctor
        run: |
          set +e
          node src/cli/create-vidra-app/dist/cli.js doctor
          echo "doctor exit: $?"

      # `--plan` returns before the MAUI workload gate, so the preview renders
      # for both desktop targets on a Linux runner with no workloads installed.
      - name: Assert vidra build --plan renders for both targets
        run: |
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/index.js" \
            plan-smoke --app-id=com.vidra.plansmoke
          cd plan-smoke
          for target in macos windows; do
            output=$(node "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/cli.js" build --target "$target" --plan)
            echo "$output"
            echo "$output" | grep -q "nothing has run" || {
              echo "::error::--plan for $target did not render the dry-run footer"; exit 1; }
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-trx
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # Per-OS smoke tier. Proves, on each target OS, that:
  #   (a) the real C# bridge wire format round-trips over stdio,
  #   (b) the framework's own dogfood host still builds,
  #   (c) the scaffolded template builds end-to-end against locally-packed NuGets,
  #   (d) `vidra build` produces a correctly signed installer, and
  #   (e) the app inside that installer actually launches and completes a
  #       C# <-> JS bridge round-trip.
  #
  # (d) and (e) use a throwaway self-signed certificate. Apple's and Microsoft's
  # trust chains matter for notarization and SmartScreen reputation, not for
  # producing and verifying a signature — so the entire signing path is covered
  # here without any paid certificate.
  smoke:
    name: Smoke (${{ matrix.os }})
    # Deliberately not `needs: unit-and-contract`. Gating the per-OS legs behind
    # the Linux tier added its full duration to every run's wall clock without
    # making failures visible any sooner — the Linux job reports independently
    # either way. Runners are free for a public repo, so the only thing the gate
    # bought was a slower green.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tfm: net10.0-windows10.0.19041.0
            maui-workload: maui-windows
            target: windows
            artifact-ext: zip
          - os: macos-latest
            tfm: net10.0-maccatalyst
            maui-workload: maui
            target: macos
            artifact-ext: dmg
    runs-on: ${{ matrix.os }}
    # Caps a hung step. The self-signed certificate steps are the risk: adding a
    # cert to a trusted root store raises an interactive confirmation that a
    # headless runner can never answer.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            src/cli/create-vidra-app/package-lock.json
            src/sdk/vidra-js/package-lock.json

      # NuGet restore dominates the per-OS jobs — on Windows the dogfood host
      # spent ~115s restoring and only ~20s compiling. The packages are keyed by
      # the project files, so a hit makes every later restore in the job (the
      # dogfood host, pack-local.sh, the scaffolded app) essentially free.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'pack-local.sh') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # No xcode-select pin. There used to be one at 26.3, from when that was
      # the newest Xcode on the image and the Catalyst reference assemblies
      # already wanted a newer SDK than any Xcode present (MT0180) — pinning at
      # least kept the rest of the toolchain on the best available. The image
      # has moved on and the pin inverted: it held the runner at 26.3 while the
      # current Catalyst pack requires the 26.5 SDK from Xcode 26.6, so the
      # linker failed the build the pin was meant to protect. The image default
      # satisfies the pack; log what we got rather than choosing for it.
      - name: Log Xcode version (macOS)
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcodebuild -version
          ls -d /Applications/Xcode*.app 2>/dev/null || true

      # ---- Fast bridge echo-ping (no MAUI workload needed) ----
      - name: Build Vidra.Bridge.Smoke harness
        shell: bash
        run: |
          dotnet build tests/dotnet/Vidra.Bridge.Smoke/Vidra.Bridge.Smoke.csproj \
            -c Release

      - name: Run echo-ping smoke over stdio
        shell: bash
        env:
          VIDRA_SMOKE_CONFIG: Release
        run: node tests/smoke/echo-ping.mjs

      # ---- Template build smoke (requires MAUI workload) ----
      #
      # The manifest is deliberately NOT pinned. `--skip-manifest-update` used to
      # be here because the newest maccatalyst manifest wanted the SDK from
      # Xcode 26.4 while macos-latest topped out at 26.3 (MT0180 in ILLink's
      # Setup step); the image now ships 26.6, so the reason is gone — and the
      # pin had become actively harmful. It held the Catalyst SDK pack at
      # 26.0.11017, where `dotnet run` execs `$(AssemblyName).app` while the
      # build produces `$(_AppBundleName).app` (dotnet/macios#26318, fixed in
      # 26.2.10233+). CI was therefore the only place the app could not launch
      # under `dotnet watch`, which is precisely what this job exists to prove.
      - name: Install MAUI workload (${{ matrix.maui-workload }})
        shell: bash
        run: dotnet workload install ${{ matrix.maui-workload }}

      - name: Log installed workloads
        shell: bash
        run: dotnet workload list

      # ---- Locator conformance (macOS only) ----
      #
      # Vidra ships its own IVelopackLocator because Velopack's client does not
      # enumerate Mac Catalyst. The objection to owning one is that it encodes
      # an install layout Velopack can change without calling it breaking, so
      # this asserts ours answers exactly what `OsxVelopackLocator` answers over
      # the same fixture bundle. It has to run here rather than on Linux for the
      # same reason the locator exists: theirs refuses to construct off macOS.
      #
      # After the workload install, not before it: the test project references
      # the `net10.0` half of a package that also targets `net10.0-maccatalyst`,
      # and restoring it needs the Catalyst workload even though nothing here
      # builds that half.
      - name: Locator conformance against Velopack's own (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dotnet test tests/dotnet/Vidra.Updates.Native.Tests/Vidra.Updates.Native.Tests.csproj \
            -c Release --logger "trx;LogFileName=updates-native-macos.trx"

      - name: Build SDK
        shell: bash
        working-directory: src/sdk/vidra-js
        run: |
          npm ci || npm install
          npm run build

      - name: Build and link CLI
        shell: bash
        working-directory: src/cli/create-vidra-app
        run: |
          npm ci || npm install
          npm run build

      - name: Run vidra doctor
        shell: bash
        run: |
          set +e
          node src/cli/create-vidra-app/dist/cli.js doctor
          echo "doctor exit: $?"

      # The framework's own dogfood host is the only consumer of the aggregate
      # `--scope core` codegen target, so nothing else in CI would notice if it
      # stopped compiling.
      - name: Build the dogfood host (${{ matrix.tfm }})
        shell: bash
        run: |
          # No preparatory build of Vidra.CodeGen: the host's post-build codegen
          # runs the tool with `--no-build`, and ordering that is the host's own
          # job (it carries a build-order ProjectReference to the tool). Wiping
          # the tool's Debug output first keeps this a clean-checkout test even
          # if some earlier step in this job starts building it.
          rm -rf src/tools/Vidra.CodeGen/bin/Debug
          dotnet build src/host/Vidra.Host.Maui/Vidra.Host.Maui.csproj \
            -c Debug -f ${{ matrix.tfm }}

      # This build is what regenerates the SDK's committed built-in contracts,
      # so it is also the only place drift in them can be caught. macOS only:
      # the runner checks out with autocrlf, the generator writes LF, and every
      # regenerated file would read as modified on Windows.
      - name: Built-in contracts are unchanged by the dogfood build
        if: runner.os == 'macOS'
        shell: bash
        run: git diff --exit-code -- src/sdk/vidra-js/src/generated

      - name: Pack local NuGet feed
        shell: bash
        run: ./pack-local.sh

      - name: Scaffold a throwaway app with create-vidra-app
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          node "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/index.js" \
            vidra-smoke --app-id=com.vidra.smoke
          ls vidra-smoke

      - name: dotnet restore scaffolded host project (${{ matrix.tfm }})
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          dotnet restore src/VidraSmoke.Host/VidraSmoke.Host.csproj \
            -p:TargetFramework=${{ matrix.tfm }}

      - name: dotnet build scaffolded host project (${{ matrix.tfm }})
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          dotnet build src/VidraSmoke.Host/VidraSmoke.Host.csproj \
            -c Debug \
            -f ${{ matrix.tfm }} \
            --no-restore

      - name: Build scaffolded UI (Vite)
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke/ui
        run: |
          npm ci || npm install
          npm run build --if-present

      # ---- Signing identity (throwaway, self-signed) ----
      - name: Create a self-signed signing identity (macOS)
        timeout-minutes: 5
        if: runner.os == 'macOS'
        shell: bash
        run: bash tests/ci/macos-selfsigned-identity.sh

      - name: Create a self-signed signing certificate (Windows)
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/ci/windows-selfsigned-cert.ps1

      # ---- Dev-loop smoke: `vidra dev` and the C# dev loop ----
      #
      # Runs before the E2E MainPage is installed, so it exercises the normal
      # template page (the E2E variant exits the process on success, which would
      # end the dev session immediately).
      #
      # macOS only for now: the script tears the session down via POSIX process
      # groups, which git-bash on the Windows runner does not provide. Windows
      # dev-loop coverage needs a PowerShell counterpart.
      #
      # Every check in the script is a hard assertion, including the two that
      # used to be warnings — the app reaching readiness, and coming back up
      # after a C# edit. Both were blocked by `dotnet watch run` never launching
      # a Mac Catalyst app; `vidra dev` no longer asks it to. Two full builds and
      # launches fit inside the timeout with room to spare.
      - name: Smoke the dev loop (vidra dev + a C# edit reaching the app)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        shell: bash
        run: |
          bash tests/ci/dev-loop-smoke.sh \
            "${{ runner.temp }}/vidra-smoke" \
            "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/cli.js" \
            ${{ matrix.target }}

      # ---- Runtime E2E harness ----
      #
      # Swap the scaffolded app's MainPage for one that calls into JavaScript
      # over the typed contract and writes the result to $VIDRA_E2E_PROOF. The
      # launch steps below assert that proof, which is only produced if the
      # packaged app loaded its bundled assets, passed the protocol-v2
      # fingerprint handshake, and completed a full C# -> JS -> C# round-trip.
      - name: Install the E2E proof MainPage into the scaffolded app
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          sed 's/__PROJECT_NAMESPACE__/VidraSmoke/' \
            "$GITHUB_WORKSPACE/tests/smoke/e2e-main-page.cs.in" \
            > src/VidraSmoke.Host/MainPage.cs
          echo "---- MainPage.cs ----"
          head -25 src/VidraSmoke.Host/MainPage.cs

      # Proves the whole version chain end to end, and proves it is the app's
      # package.json driving it: 1.2.3 exists nowhere else, so a bundle carrying
      # it cannot have come from the template's csproj default.
      - name: Set a distinctive app version
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          node -e "const f='package.json',p=require('./'+f);p.version='1.2.3';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          node -p "require('./package.json').version"

      - name: Preview the build plan (vidra build --plan)
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          node "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/cli.js" \
            build --target ${{ matrix.target }} --plan

      # ---- Packaging smoke: run the real `vidra build` end-to-end ----
      - name: Package the scaffolded app (vidra build --target ${{ matrix.target }})
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          node "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/cli.js" \
            build --target ${{ matrix.target }} --verbose

      # ApplicationDisplayVersion -> CFBundleShortVersionString, and the derived
      # build number -> CFBundleVersion (0.1.0 would have been 100; 1.2.3 is
      # 1*10000 + 2*100 + 3).
      - name: The app version reached the bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          plist="$(find src/VidraSmoke.Host/bin/Release/net10.0-maccatalyst -name Info.plist -path '*.app/Contents/*' -print -quit)"
          echo "plist: $plist"
          short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          echo "CFBundleShortVersionString=$short CFBundleVersion=$build"
          [ "$short" = "1.2.3" ] || { echo "::error::expected 1.2.3 from package.json, got $short"; exit 1; }
          [ "$build" = "10203" ] || { echo "::error::expected build 10203, got $build"; exit 1; }

      - name: The app version reached the artifact name
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          ls -1 dist/
          ls dist/ | grep -q "1\.2\.3" || { echo "::error::no artifact carries the app version"; exit 1; }

      - name: Verify a distributable artifact was produced
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          echo "Contents of dist/:"
          ls -la dist/ 2>/dev/null || { echo "::error::vidra build did not create a dist/ directory"; exit 1; }
          shopt -s nullglob
          # Assert the artifact this target is supposed to produce, so a target
          # silently emitting the wrong kind of installer fails here.
          artifacts=(dist/*.${{ matrix.artifact-ext }})
          if [ ${#artifacts[@]} -ne 1 ]; then
            echo "::error::expected exactly one .${{ matrix.artifact-ext }} for target ${{ matrix.target }}, found ${#artifacts[@]}"
            exit 1
          fi
          artifact="$PWD/${artifacts[0]}"
          # The Windows leg runs these steps under git-bash but consumes
          # $ARTIFACT from PowerShell, which cannot resolve an MSYS path.
          if command -v cygpath >/dev/null 2>&1; then
            artifact="$(cygpath -w "$artifact")"
          fi
          echo "ARTIFACT=$artifact"
          echo "ARTIFACT=$artifact" >> "$GITHUB_ENV"

      - name: Verify the macOS signature, hardened runtime and entitlements
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash tests/ci/verify-macos-artifact.sh "$ARTIFACT" \
            "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/cli.js"

      - name: Launch the packaged app and prove the bridge works (macOS)
        timeout-minutes: 10
        if: runner.os == 'macOS'
        shell: bash
        run: bash tests/ci/launch-macos-app.sh "$ARTIFACT"

      - name: Verify the signature, launch, and prove the bridge works (Windows)
        timeout-minutes: 10
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tests/ci/launch-windows-app.ps1 -Zip "$env:ARTIFACT" `
            -Cli "$env:GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/cli.js"

      # ---- Over-the-air bundle updates ----
      #
      # A second build of the same scaffold, configured for updates and driven
      # through a sequence of launches against a real HTTP feed. Sequence is the
      # point: "applies on the next launch", "never applies", and "is undone
      # after failing twice" are all statements about consecutive runs, and none
      # of them can be observed from a single one.
      - name: Configure the scaffolded app for updates
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          # The opt-in a real app makes: one builder call, and a feed in
          # package.json that `vidra build` stamps into the bundle.
          # A real signing key, made by the command a publisher would run. The
          # public half goes into package.json, which makes signatures mandatory
          # for this app — so the whole run also proves the signed path works.
          node "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/cli.js" \
            keygen --out ota-signing-key.pem
          node -e "
            const fs = require('fs');
            const file = 'src/VidraSmoke.Host/MauiProgram.cs';
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes('.UseVidra()')) { console.error('no UseVidra() call to extend'); process.exit(1); }
            fs.writeFileSync(file, source.replace('.UseVidra()', '.UseVidra()\n            .UseVidraUpdates()'));
            const publicKey = fs.readFileSync('ota-signing-key.pem.pub', 'utf8').trim();
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.vidra = { updates: { feedUrl: 'http://127.0.0.1:8099/bundles.json', publicKeys: [publicKey] } };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          sed 's/__PROJECT_NAMESPACE__/VidraSmoke/' \
            "$GITHUB_WORKSPACE/tests/smoke/ota-main-page.cs.in" \
            > src/VidraSmoke.Host/MainPage.cs
          grep -n "UseVidraUpdates" src/VidraSmoke.Host/MauiProgram.cs

      - name: Rebuild the app with updates enabled
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          node "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/cli.js" \
            build --target ${{ matrix.target }}

      - name: Locate the update-enabled app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          root=src/VidraSmoke.Host/bin/Release/net10.0-maccatalyst
          app="$(find "$root" -maxdepth 1 -name '*.app' -type d -print -quit)"
          [ -n "$app" ] || { echo "::error::no .app under $root"; exit 1; }
          echo "OTA_BIN=$PWD/$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)" >> "$GITHUB_ENV"

      - name: Locate the update-enabled app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          exe="src/VidraSmoke.Host/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/VidraSmoke.Host.exe"
          [ -f "$exe" ] || { echo "::error::no VidraSmoke.Host.exe at $exe"; exit 1; }
          echo "OTA_BIN=$(cygpath -w "$PWD/$exe")" >> "$GITHUB_ENV"

      - name: Prove an update applies, is refused, or is rolled back
        timeout-minutes: 20
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          native() { if command -v cygpath >/dev/null 2>&1; then cygpath -w "$1"; else echo "$1"; fi; }
          node "$(native "$GITHUB_WORKSPACE/tests/smoke/ota-e2e.mjs")" \
            --bin "$OTA_BIN" \
            --project "$(native "$PWD")" \
            --cli "$(native "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/cli.js")" \
            --signing-key "$(native "$PWD/ota-signing-key.pem")" \
            --work "$(native "${{ runner.temp }}/ota-work")"

      - name: Upload OTA proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-proofs-${{ matrix.os }}
          path: ${{ runner.temp }}/ota-work/*.json
          if-no-files-found: ignore

      # The control for the bisect further down: this is the app *before* it
      # references Velopack, copied out of its build tree and run. If it stays
      # up and the post-Velopack build does not, the package reference is the
      # difference rather than anything packing did.
      - name: A pre-Velopack build survives being copied (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          set +e
          built="$(find src/VidraSmoke.Host/bin/Release/net10.0-maccatalyst -maxdepth 1 -name '*.app' -type d -print -quit)"
          dest="${{ runner.temp }}/prenative.app"
          rm -rf "$dest"; ditto "$built" "$dest"
          exe="$dest/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$dest/Contents/Info.plist")"
          "$exe" > "${{ runner.temp }}/prenative.log" 2>&1 &
          pid=$!
          sleep 25
          if kill -0 "$pid" 2>/dev/null; then
            echo "RUNS — the copied pre-Velopack app is still alive after 25s"
            kill -9 "$pid"
          else
            echo "DIED — the copied pre-Velopack app exited on its own:"
            sed -n '1,25p' "${{ runner.temp }}/prenative.log"
          fi
          exit 0

      # ---- Native (whole-app) updates ----
      #
      # The same scaffold again, this time shipping Velopack: two releases built
      # by `vidra build --native-update`, the first one installed, and the second
      # applied to it in place. Folded in from the throwaway `probe/velopack`
      # rig, which proved the sequence against raw Velopack — what is under test
      # here is Vidra's own glue: the entry points, the builder call, the config
      # resolution, and (on macOS) the Catalyst locator Velopack does not ship.
      #
      # macOS is the leg that can still fail. No Catalyst app had completed a
      # Velopack round-trip when this was written.
      - name: Install vpk
        shell: bash
        run: |
          dotnet tool install -g vpk || dotnet tool update -g vpk
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$USERPROFILE\\.dotnet\\tools" >> "$GITHUB_PATH"
          else
            echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          fi

      - name: Configure the scaffolded app for native updates (1.0.0)
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          node "$GITHUB_WORKSPACE/tests/ci/native-update-setup.mjs" \
            --project "$PWD" --name VidraSmoke --version 1.0.0 \
            --main-page "$GITHUB_WORKSPACE/tests/smoke/native-update-main-page.cs.in"

      # The feed is not serving during the build, so `vpk download` finds
      # nothing and warns — which is exactly the first-release case.
      - name: Build and pack 1.0.0
        timeout-minutes: 25
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          node "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/cli.js" \
            build --target ${{ matrix.target }} --native-update
          ls -la dist dist/release

      # `vpk pack` overwrites the un-versioned artifacts in its output directory
      # on every release, so anything from 1.0.0 has to be taken before 1.0.1 is
      # packed. `vidra build` already writes a versioned Setup.exe for exactly
      # this reason; the portable archive still has to be captured by hand.
      - name: Capture the 1.0.0 install
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          rm -rf "${{ runner.temp }}/native-install"
          mkdir -p "${{ runner.temp }}/native-install"
          zip="$(ls dist/release/*Portable.zip | head -1)"
          echo "portable: $zip"
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -x -k "$zip" "${{ runner.temp }}/native-install"
            app="$(find "${{ runner.temp }}/native-install" -maxdepth 2 -name '*.app' -type d -print -quit)"
            [ -n "$app" ] || { echo "::error::no .app inside the portable archive"; exit 1; }
            echo "NATIVE_EXE=$app" >> "$GITHUB_ENV"
            echo "==> installed 1.0.0 at $app"
          else
            cp dist/VidraSmoke-1.0.0-Setup.exe "${{ runner.temp }}/Setup-1.0.0.exe"
          fi

      # What `vpk pack` did to the bundle, recorded rather than reasoned about.
      # The first Catalyst round-trip died inside the mono runtime before any
      # managed code ran, and the difference between the bundle that launches
      # and the one that does not is somewhere in here.
      - name: What packing changed about the bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          set +e
          built="$(find src/VidraSmoke.Host/bin/Release/net10.0-maccatalyst -maxdepth 1 -name '*.app' -type d -print -quit)"
          packed="$NATIVE_EXE"
          echo "built:  $built"
          echo "packed: $packed"

          for label in built packed; do
            if [ "$label" = built ]; then app="$built"; else app="$packed"; fi
            echo "======== $label: $app"
            echo "-- counts: $(find "$app" -type f | wc -l) files, $(find "$app" -type l | wc -l) symlinks"
            echo "-- symlinks:"; find "$app" -type l | sed "s|$app/||" | sort | head -30
            echo "-- Contents:"; ls -la "$app/Contents"
            echo "-- codesign:"; codesign -dv --verbose=2 "$app" 2>&1 | head -8
            echo "-- verify:"; codesign --verify --strict "$app" 2>&1 | head -5
            echo "-- verify --deep:"; codesign --verify --deep --strict "$app" 2>&1 | head -5
          done

          echo "======== present in the built bundle, missing from the packed one"
          diff <(cd "$built" && find . | sort) <(cd "$packed" && find . | sort) | head -40
          exit 0

      # The bundles above are identical apart from three files and a fresh
      # signature, and both verify strictly — so the reason one launches and the
      # other does not is not visible by inspection. Apply the transformations
      # one at a time instead and see which one stops the app booting.
      - name: Which packing step stops the app from launching (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          built="$(find src/VidraSmoke.Host/bin/Release/net10.0-maccatalyst -maxdepth 1 -name '*.app' -type d -print -quit)"
          bash "$GITHUB_WORKSPACE/tests/ci/macos-packed-launch-bisect.sh" \
            "$built" \
            "$PWD/src/VidraSmoke.Host/Entitlements.plist" \
            "${{ runner.temp }}/bisect"

      - name: Build and pack 1.0.1
        timeout-minutes: 25
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          node "$GITHUB_WORKSPACE/tests/ci/native-update-setup.mjs" \
            --project "$PWD" --name VidraSmoke --version 1.0.1
          node "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/cli.js" \
            build --target ${{ matrix.target }} --native-update
          ls -la dist/release
          cat dist/release/releases*.json

      # The one question CI can answer about re-packing: `vpk pack` refuses a
      # version already in the feed rather than overwriting it or emitting a
      # second package under one version. Measured on Linux with vpk 1.2.0;
      # asserted here on the platform that actually ships.
      - name: Re-packing a published version is refused, not silently accepted
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          set +e
          output="$(node "$GITHUB_WORKSPACE/src/cli/create-vidra-app/dist/cli.js" \
            build --target ${{ matrix.target }} --native-update 2>&1)"
          code=$?
          set -e
          echo "$output"
          [ $code -ne 0 ] || { echo "::error::re-packing 1.0.1 should have failed"; exit 1; }
          echo "$output" | grep -qi "already in the feed" || {
            echo "::error::expected the 'already in the feed' message"; exit 1; }

      - name: Install 1.0.0 with the generated Setup.exe (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $setup = "${{ runner.temp }}/Setup-1.0.0.exe"
          Write-Host "running $setup --silent"
          $p = Start-Process -FilePath $setup -ArgumentList "--silent" -PassThru -Wait
          Write-Host "setup exit code: $($p.ExitCode)"
          $root = Join-Path $env:LOCALAPPDATA "com.vidra.smoke"
          if (-not (Test-Path $root)) {
            Write-Host "::error::no install root at $root"
            exit 1
          }
          Get-ChildItem -Recurse -Depth 2 $root | Select-Object -First 40 | Format-Table FullName
          $exe = Get-ChildItem -Recurse $root -Filter "VidraSmoke.Host.exe" | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::no VidraSmoke.Host.exe under $root"; exit 1 }
          "NATIVE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply a 1.0.0 -> 1.0.1 native update
        timeout-minutes: 25
        shell: bash
        working-directory: ${{ runner.temp }}/vidra-smoke
        run: |
          native() { if command -v cygpath >/dev/null 2>&1; then cygpath -w "$1"; else echo "$1"; fi; }
          node "$(native "$GITHUB_WORKSPACE/tests/smoke/native-update-e2e.mjs")" \
            --exe "$(native "$NATIVE_EXE")" \
            --feed "$(native "$PWD/dist/release")" \
            --work "$(native "${{ runner.temp }}/native-work")"

      - name: The updated app is still signed (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          [ -n "${NATIVE_EXE:-}" ] || exit 0
          # Deliberately reported, not asserted. An updater-replaced bundle
          # keeping a valid signature is the claim; whether Gatekeeper accepts
          # it needs a notarized build, which no CI here can produce.
          codesign -dv --verbose=4 "$NATIVE_EXE" 2>&1 | sed -n '1,12p' || true
          codesign --verify --strict "$NATIVE_EXE" 2>&1 || true

      - name: Upload native-update proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-update-proofs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/native-work/*
            ${{ runner.temp }}/vidra-smoke/dist/release/releases*.json
          if-no-files-found: ignore

      # Uploaded even on failure, since a broken installer is worth inspecting.
      # Staying lenient here is deliberate: the strict gate is the
      # "Verify a distributable artifact was produced" step above, which asserts
      # exactly one artifact of the expected type. Making the upload strict too
      # would bury an earlier real failure under a second, confusing one.
      - name: Upload packaged installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidra-installer-${{ matrix.os }}
          path: ${{ runner.temp }}/vidra-smoke/dist/*
          if-no-files-found: ignore
