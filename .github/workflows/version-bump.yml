name: Bump version

# The one place the Vidra version changes. Run it from the Actions tab, pick
# patch/minor/major, and it opens a PR that moves version.json and every file
# derived from it.
#
# Why a PR rather than a push to main: the bump touches the npm packages and the
# .NET packages at once, and the PR gets the full CI suite before the number
# becomes real. Merging it is what makes the release available; publishing is
# still the separate, deliberate step in release-npm.yml / release-nuget.yml.
#
# Nothing here bumps an *app's* version — that is the app's own package.json,
# bumped with `npm version patch` by whoever owns the app.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part to increment"
        type: choice
        options: [patch, minor, major, explicit]
        default: patch
      version:
        description: "Exact version, when bump = explicit (e.g. 1.0.0-rc.1)"
        type: string
        required: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # A bump on top of an already-inconsistent tree would bury the drift in a
      # release commit, so refuse before touching anything.
      - name: The tree must already be consistent
        run: node scripts/version.mjs check

      - name: Work out the next version
        id: next
        run: |
          current="$(node -p "require('./version.json').version")"
          case "${{ inputs.bump }}" in
            explicit)
              next="${{ inputs.version }}"
              if [ -z "$next" ]; then
                echo "::error::bump=explicit requires a version"; exit 1
              fi
              ;;
            *)
              # Strip any prerelease before incrementing: bumping the patch of
              # 1.2.3-rc.1 means 1.2.4, not 1.2.3-rc.2.
              base="${current%%-*}"
              IFS=. read -r major minor patch <<< "$base"
              case "${{ inputs.bump }}" in
                major) next="$((major + 1)).0.0" ;;
                minor) next="$major.$((minor + 1)).0" ;;
                patch) next="$major.$minor.$((patch + 1))" ;;
              esac
              ;;
          esac
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "$current -> $next"

      - name: Refuse to reuse a released version
        run: |
          if git rev-parse "v${{ steps.next.outputs.next }}" >/dev/null 2>&1; then
            echo "::error::tag v${{ steps.next.outputs.next }} already exists"; exit 1
          fi

      - name: Apply the bump
        run: |
          node scripts/version.mjs set "${{ steps.next.outputs.next }}"
          node scripts/version.mjs check
          git diff --stat

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/v${{ steps.next.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "release: v${{ steps.next.outputs.next }}"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "release: v${{ steps.next.outputs.next }}" \
            --body "$(printf '%s\n' \
              "Bumps Vidra from \`${{ steps.next.outputs.current }}\` to \`${{ steps.next.outputs.next }}\` — the npm packages and every NuGet package move together, from \`version.json\`." \
              "" \
              "Generated by the \`Bump version\` workflow (\`${{ inputs.bump }}\`). Merging makes the version real; publishing is still a separate run of \`Release npm\` / \`Release NuGet\`.")"
